<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magnus &amp; Mathilde</title>
  <meta name="robots" content="noindex">
  <style>
    :root { --bg: #f4f1ec; --ink: #2b2a27; --muted: #7a756c; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--ink);
      font-family: Georgia, "Times New Roman", serif; text-align: center; padding: 24px;
    }
    h1 { font-weight: normal; font-size: clamp(2.2rem, 7vw, 4.5rem); letter-spacing: 0.02em; }
    .amp { font-style: italic; color: var(--muted); }
    p { margin-top: 1.5rem; font-size: 1rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Magnus <span class="amp">&amp;</span> Mathilde</h1>
    <p>Mer informasjon kommer</p>
  </main>
</body>
</html>
